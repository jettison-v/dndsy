<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>askdnd Processor</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 2.5rem auto; padding: 0 1rem; color: #222; background: #fafaf7; }
    h1 { margin: 0 0 .25rem; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .muted { color: #777; font-size: .9rem; }
    .button, button { display: inline-block; padding: .55rem 1.1rem; border: 1px solid #bbb; border-radius: 6px; background: #fff; color: #222; text-decoration: none; font: inherit; cursor: pointer; }
    .primary { background: #2c5e3f; border-color: #2c5e3f; color: #fff; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: .75rem 1rem; margin: 1rem 0; }
    .ok { background: #eef8ee; border-color: #9c9; }
    .bad { background: #fdeeee; border-color: #d99; }
    .warn { background: #fff6d6; border-color: #e3c766; }
    .inline { display: inline; }
    table.list { width: 100%; border-collapse: collapse; }
    table.list td { padding: .4rem .3rem; border-bottom: 1px solid #e5e5e5; }
    .pill { font-size: .8rem; padding: .1rem .5rem; border-radius: 999px; background: #eee; }
    .pill.review { background: #fff1c2; } .pill.saved, .pill.sent { background: #d8f0dc; } .pill.filtering { background: #dde8fb; }
  </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
