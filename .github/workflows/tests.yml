# Runs the test suite on every push and pull request. Railway's "Wait for CI" setting holds the beta deploy until
# this workflow passes (it judges the whole run, and the run fails if either job fails), so a failing test never ships.
#
# Two jobs side by side, so the wait is the slower one, not the sum (docs/SETUP_LOG.md, 2026-10-24):
# - Server tests: everything outside tests/browser, in parallel (pytest-xdist, one worker per CPU, each with its own
#   database) after the lint.
# - Browser tests: tests/browser, real Chromium pages against a real askdnd server (and WebKit, Safari's engine, for the
#   layout at phone and tablet widths), inside Playwright's own image (both browsers and their system libraries
#   already installed; its tag matches uv.lock's Playwright, tests/test_deploy.py).
#   Installing those libraries on GitHub's machine usually took seconds but sometimes 8-12 minutes (2026-10-26),
#   holding up every deploy.
#   They run in three parts side by side (Nov 5: one after another they took 6-7 minutes, the longest wait for a merge):
#   the layout at every width, the real extension, and every other flow. "Browser tests", the check main's protection
#   asks for, passes only when all three do.
# Together they run every test. On GitHub a skip fails the run (tests/conftest.py): missing tooling must fail here.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request cancels the run still going for the older one: only the newest is checked
# (Nov 6: the account's Actions minutes ran low; every run is about 14 minutes across its five jobs). main's own runs
# are never cancelled, so each merge is checked before Railway deploys it.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "1"
  TEST_DATABASE_URL: postgresql+psycopg://askdnd:askdnd@localhost:5432/askdnd_test
  APP_ENV: development
  # Opens tests/fixtures/ddb.locked, the party's saved D&D Beyond sheets (scripts/fixtures.py; the books' words, not ours
  # to publish). A pull request from a fork gets no secrets, so its tests can't read them: only ours run
  FIXTURES_KEY: ${{ secrets.FIXTURES_KEY }}

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres: &postgres
        image: postgres:18
        env:
          POSTGRES_USER: askdnd
          POSTGRES_PASSWORD: askdnd
          POSTGRES_DB: askdnd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U askdnd"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - name: Lint (unused imports, undefined names)
        run: uv run ruff check app scripts tests
      - name: Tests, with how much of the app they reach
        run: uv run pytest -q --durations=15 --ignore=tests/browser --cov=app --cov-branch --cov-report= --cov-fail-under=90
      - name: Coverage on the run's summary page
        if: always()
        run: uv run coverage report --format=markdown --skip-covered --sort=cover >> "$GITHUB_STEP_SUMMARY" || true

  browser-part:
    name: Browser tests (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: layout
            files: tests/browser/test_layout.py
          - part: extension
            files: tests/browser/test_extension.py
          - part: flows
            files: tests/browser --ignore=tests/browser/test_layout.py --ignore=tests/browser/test_extension.py
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
      options: --ipc=host  # Chromium's shared memory (Playwright's advice for Docker)
    env:
      # Inside a container, the database service is reached by its name
      TEST_DATABASE_URL: postgresql+psycopg://askdnd:askdnd@postgres:5432/askdnd_test
    services:
      postgres: *postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      # One server per file: these run one after another (-n 0), in the order they're written. A test that fails is
      # tried once more (tests/browser/conftest.py); each second try is listed on the run's summary page, to be fixed
      - name: Tests
        shell: bash
        run: uv run pytest -q --durations=5 -n 0 -rR ${{ matrix.files }} | tee pytest.out
      - name: Passed only on a second try (on the run's summary page)
        if: always()
        run: |
          if grep -q "^RERUN" pytest.out 2>/dev/null; then
            { echo "### Browser tests (${{ matrix.part }}): passed only on a second try"; grep "^RERUN" pytest.out | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  browser:
    name: Browser tests
    needs: browser-part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All three parts passed
        run: test "${{ needs.browser-part.result }}" = success
