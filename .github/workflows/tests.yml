# Runs the test suite on every push and pull request. Railway's "Wait for CI" setting holds the beta deploy until
# every job here passes, so a failing test never ships.
#
# Two jobs side by side, so the wait is the slower one, not the sum (docs/SETUP_LOG.md, 2026-10-24):
# - Server tests: everything outside tests/browser, in parallel (pytest-xdist, one worker per CPU, each with its own
#   database) after the lint.
# - Browser tests: tests/browser, real Chromium pages against a real askdnd server. Chromium comes from a cache
#   keyed by Playwright's version, so it downloads only when Playwright is upgraded.
# Together they run every test. On GitHub a skip fails the run (tests/conftest.py): missing tooling must fail here.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  CI: "1"
  TEST_DATABASE_URL: postgresql+psycopg://askdnd:askdnd@localhost:5432/askdnd_test
  APP_ENV: development

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres: &postgres
        image: postgres:18
        env:
          POSTGRES_USER: askdnd
          POSTGRES_PASSWORD: askdnd
          POSTGRES_DB: askdnd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U askdnd"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      # A throwaway database: no waiting for the disk on every write (it only matters after a crash)
      - name: Fast test database
        run: psql "postgresql://askdnd:askdnd@localhost:5432/askdnd_test" -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - name: Lint (unused imports, undefined names)
        run: uv run ruff check app scripts tests
      - run: uv run pytest -q --durations=15 --ignore=tests/browser

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres: *postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - name: Playwright's version
        id: playwright
        run: echo "version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cached test browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the test browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps --only-shell chromium
      - name: Install the test browser's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: uv run playwright install-deps chromium
      # A throwaway database: no waiting for the disk on every write (it only matters after a crash)
      - name: Fast test database
        run: psql "postgresql://askdnd:askdnd@localhost:5432/askdnd_test" -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      # One server per file: these run one after another (-n 0), in the order they're written
      - run: uv run pytest -q --durations=5 -n 0 tests/browser
