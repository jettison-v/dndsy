# GitHub tells askdnd about the pull requests (scripts/github_report.py; item 39, A sturdier loop, Brett's OK Nov 24):
# after each pull request event, each test run and each push to main, it reports every open one to askdnd.ai, which
# links each to its work. A pull request with nothing behind it becomes an Upkeep card there: no pull request without
# a card. It changes nothing on GitHub: one set to merge by itself that falls behind main is a gap for Claude, who
# brings it up to date under a person's sign-in (Nov 24: runs GitHub's own robot starts wait for a person's approval).
#
# Safe on pull_request_target: it checks out main's copy of the script, never a pull request's own code, and reads
# titles only as data (never put into a command). FFT_GITHUB_KEY may report only pull requests and GitHub's own jobs
# (app/fft/keys.py); Dependabot's runs read it from Dependabot's own secrets.
name: Report to askdnd

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed, ready_for_review, converted_to_draft, auto_merge_enabled, auto_merge_disabled]
  workflow_run:
    workflows: [Tests]
    types: [requested, completed]
  push:
    branches: [main]
  # Every night, even when nothing happened: askdnd's cards compared with GitHub's open pull requests (scope v4, the
  # nightly comparison), and anything merged since released; and by hand from the Actions tab
  schedule:
    - cron: "15 11 * * *"  # 11:15 UTC, after the Mini's 4:00 nightly on the West Coast
  workflow_dispatch:

permissions:  # (it only reads)
  contents: read
  pull-requests: read
  checks: read
  actions: read  # (each check's workflow, which `gh pr list --json statusCheckRollup` reads)

# One at a time, newest waiting: each run reads everything afresh, so a skipped one loses nothing
concurrency:
  group: report-to-askdnd
  cancel-in-progress: false

jobs:
  report:
    name: Report to askdnd
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/github_report.py
          sparse-checkout-cone-mode: false
      - run: python3 scripts/github_report.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FFT_GITHUB_KEY: ${{ secrets.FFT_GITHUB_KEY }}
