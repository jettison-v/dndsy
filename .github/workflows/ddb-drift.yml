# Every morning: has D&D Beyond's sheet changed shape under our tests? (scripts/ddb_drift.py; Brett, 2026-11-05)
# The tests read D&D Beyond through copies in tests/fixtures/ddb; this reads today's test sheets and compares. A miss
# fails the run, and GitHub emails Brett. It never deploys or blocks a merge. Run it by hand from the Actions tab
# (D&D Beyond drift › Run workflow).
name: D&D Beyond drift

on:
  schedule:
    - cron: "30 12 * * *"  # 12:30 UTC, early morning on the West Coast, after the Mini's 4:00 nightly
  workflow_dispatch:

jobs:
  drift:
    name: D&D Beyond drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FFT_GITHUB_KEY: ${{ secrets.FFT_GITHUB_KEY }}  # (reports its run to askdnd.ai; unset, the report step is skipped)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - id: drift
        run: uv run python scripts/ddb_drift.py
        env:
          FIXTURES_KEY: ${{ secrets.FIXTURES_KEY }}  # (the saved sheets are locked: scripts/fixtures.py)
      # Its run on askdnd.ai's Development › Scheduled (the jobs audit, Brett's pick 1, Nov 21): FFT_GITHUB_KEY may report
      # only this job (app/fft/keys.py JOBS_OF). Never fails the run itself.
      - name: Report the run to askdnd
        if: always() && env.FFT_GITHUB_KEY != ''
        env:
          RESULT: ${{ steps.drift.outcome == 'success' && 'ok' || 'failed' }}
        run: |
          words=$([ "$RESULT" = ok ] && echo "Today's sheets match the tests' copies" || echo "A sheet changed shape: see the run on GitHub")
          curl -s -m 20 -o /dev/null -X POST "https://askdnd.ai/api/fft/jobs/drift" -H "X-Fft-Key: $FFT_GITHUB_KEY" \
            -H "Content-Type: application/json" -H "User-Agent: askdnd-github" -d "{\"result\": \"$RESULT\", \"words\": \"$words\"}" || true
