[project]
name = "askdnd"
version = "0.1.0"
description = "A companion app for one D&D 2024 table: recaps, character briefings, rules answers."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.14.0",
    "authlib>=1.9.1",
    "fastapi>=0.143.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
