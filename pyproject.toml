[project]
name = "askdnd"
version = "0.1.0"
description = "A companion app for one D&D 2024 table: recaps, character briefings, rules answers."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.14.0",
    "authlib>=1.9.1",
    "boto3>=1.43.114",
    "fastapi>=0.143.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "linkify-it-py>=2.2.0",
    "markdown-it-py>=4.2.0",
    "nh3>=0.3.7",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sentry-sdk[fastapi]>=2.73.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "djlint>=1.50.0",
    "httpx2>=2.13.1",
    "mutmut>=3.8.1",
    "playwright>=1.64.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-rerunfailures>=16.7",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# In parallel, one worker per CPU; the browser tests stay together on one worker (tests/conftest.py)
addopts = "-n auto --dist loadgroup"

[tool.ruff]
line-length = 140

[tool.ruff.lint]
# Rules that catch bugs or keep the code one way (foundations F4, docs/plans/2026-11-13-engineering-practices.md):
# leftovers (F), errors (E, W, PLE), likely bugs (B, RUF, PIE), the table's clock (DTZ: never the server's date),
# nothing blocking on the event loop (ASYNC), eval/SQL/Markup used only where checked (S307, S608, S704),
# imports in one order (I), and every implicit string join in parentheses so a missing comma can't hide (ISC).
select = ["F", "E", "W", "PLE", "B", "RUF", "PIE", "DTZ", "ASYNC", "S307", "S608", "S704", "I", "ISC", "UP", "C4", "SIM", "T10", "EXE", "LOG"]
ignore = [
    "E501",  # line length: line-length above is the formatter's guide, long data lines are fine
    "E731", "E741", "E402",  # small lambdas, short names in maths, imports placed after a setup step
    "B008",  # FastAPI's Depends(...) in defaults is how it's meant to be used
    "B905",  # zip(): lists that differ in length are trimmed on purpose where it's used
    "RUF001", "RUF002", "RUF003",  # askdnd's words use real typography: ’ × − …
    "RUF005", "RUF059", "UP031",
    "SIM102", "SIM105", "SIM108", "SIM115", "SIM117",  # style only
    "ISC001",  # joined on one line by the formatter's own rule
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]  # pytest fixtures are shared by importing them
# Helpers defined inside a loop and called within the same step (never kept past it): B023 can't see that
"app/ddb_sheet.py" = ["B023"]
"scripts/real_table.py" = ["B023"]

[tool.djlint]
# djLint for the templates (foundations F4): only what catches mistakes, here a button without a type (inside a
# form it submits it) and a tag left unclosed. Off, with why:
# J004, J018: Flask's url_for/static (askdnd's pages are FastAPI's; addresses come from web.base() and static())
# H021: inline styles (a few computed ones are deliberate: a bar's width, a token's position)
# H015, H023: a line break after a heading, entity references (formatting)
# H020: an empty tag pair (askdnd fills some from app.js: a counter, a slot)
profile = "jinja"
ignore = "J004,J018,H021,H015,H023,H020"
extension = "html"

[tool.mutmut]
# Mutation testing (foundations F8, docs/plans/2026-11-13-engineering-practices.md): small deliberate bugs put into core
# logic, one at a time; the tests must catch each, and a bug they miss is a missing test. Run with
# `uv run python scripts/mutation.py <module>` (it runs one module and lists what survived); never in CI (slow).
source_paths = ["app"]
only_mutate = ["app/access.py", "app/roll_plan.py", "app/hit_points.py", "app/rules_book.py", "app/measure.py", "app/areas.py", "app/fog.py",
               "app/coins.py", "app/initiative.py", "app/conditions.py", "app/death_saves.py"]
also_copy = ["scripts", "migrations", "alembic.ini", "docs", "extension", "transcript_filter", "CLAUDE.md", ".env", ".github", "Procfile", "README.md", ".gitignore", ".gitattributes"]
pytest_add_cli_args = ["-n", "0", "-p", "no:randomly", "-p", "no:cacheprovider"]
# (the repository's own checks, which read git and its files, test no app logic: left out)
pytest_add_cli_args_test_selection = ["tests", "--ignore=tests/browser", "--ignore=tests/test_deploy.py", "--ignore=tests/test_documents.py",
                                      "--ignore=tests/test_public_safe.py", "--ignore=tests/test_no_text_refs.py", "--ignore=tests/test_test_leftovers.py",
                                      "--deselect=tests/test_models.py::test_migrations_go_down_and_up_and_match_models"]
