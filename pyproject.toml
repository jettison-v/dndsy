[project]
name = "askdnd"
version = "0.1.0"
description = "A companion app for one D&D 2024 table: recaps, character briefings, rules answers."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.14.0",
    "authlib>=1.9.1",
    "boto3>=1.43.114",
    "fastapi>=0.143.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "linkify-it-py>=2.2.0",
    "markdown-it-py>=4.2.0",
    "nh3>=0.3.7",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sentry-sdk[fastapi]>=2.73.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "playwright>=1.64.1",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# In parallel, one worker per CPU; the browser tests stay together on one worker (tests/conftest.py)
addopts = "-n auto --dist loadgroup"

[tool.ruff]
line-length = 140

[tool.ruff.lint]
# Catch leftovers: unused imports and variables, redefinitions, undefined names
select = ["F"]
per-file-ignores = { "tests/*" = ["F401", "F811"] }  # pytest fixtures are shared by importing them
