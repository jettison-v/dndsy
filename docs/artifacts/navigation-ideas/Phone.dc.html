<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone, Play mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Roboto+Condensed:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#e8b34b}a:hover{color:#f3c96f}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #15171a; color: #ebe7df; font-family: Inter, system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #0f1113; border-bottom: 2px solid #d64545; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 14px; flex: none">
    <b style="font-family: 'Roboto Condensed', sans-serif; font-size: 18px">askdnd</b>
    <span style="color: #a29d93">·</span>
    <button type="button" style="background: #1f2226; color: #ebe7df; border: 1px solid #34383e; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600">Cole ▾</button>
    <button type="button" aria-label="Live: updated 1 minute ago" style="margin-left: auto; display: flex; align-items: center; gap: 6px; background: rgba(91,191,127,.15); color: #ebe7df; border: 1px solid #5bbf7f; border-radius: 999px; padding: 5px 10px; font: inherit; font-size: 12px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #5bbf7f"></span>Live</button>
  </header>
  <main style="flex: 1; overflow: hidden; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
    <div role="group" aria-label="Mode" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #1f2226; border: 1px solid #34383e; border-radius: 10px; padding: 3px">
      <button type="button" aria-pressed="true" style="background: #d64545; color: #ffffff; border: 0; border-radius: 8px; padding: 7px 0; font: inherit; font-weight: 600">Play</button>
      <button type="button" aria-pressed="false" style="background: none; color: #a29d93; border: 0; border-radius: 8px; padding: 7px 0; font: inherit">Sheet</button>
      <button type="button" aria-pressed="false" style="background: none; color: #a29d93; border: 0; border-radius: 8px; padding: 7px 0; font: inherit">Plan</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <div style="background: #1f2226; border-radius: 10px; padding: 5px 8px"><div style="color: #a29d93; font-size: 11px">Hit points</div><b style="font-size: 18px">51</b></div>
      <div style="background: #1f2226; border-radius: 10px; padding: 5px 8px"><div style="color: #a29d93; font-size: 11px">Armor class</div><b style="font-size: 18px">16</b></div>
      <div style="background: #1f2226; border-radius: 10px; padding: 5px 8px"><div style="color: #a29d93; font-size: 11px">Initiative</div><b style="font-size: 18px">+3</b></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; text-align: center">
      <div style="background: #272b30; border-radius: 8px; padding: 4px 0"><div style="color: #a29d93; font-size: 10px">Str</div><b>+0</b></div>
      <div style="background: #272b30; border-radius: 8px; padding: 4px 0"><div style="color: #a29d93; font-size: 10px">Dex</div><b>+3</b></div>
      <div style="background: #272b30; border-radius: 8px; padding: 4px 0"><div style="color: #a29d93; font-size: 10px">Con</div><b>+2</b></div>
      <div style="background: #272b30; border-radius: 8px; padding: 4px 0"><div style="font-size: 10px"><span style="color: #5bbf7f">●</span>Int</div><b>+4</b></div>
      <div style="background: #272b30; border-radius: 8px; padding: 4px 0"><div style="font-size: 10px"><span style="color: #5bbf7f">●</span>Wis</div><b>+8</b></div>
      <div style="background: #272b30; border-radius: 8px; padding: 4px 0"><div style="color: #a29d93; font-size: 10px">Cha</div><b>+3</b></div>
    </div>
    <div role="tablist" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; margin-top: 4px">
      <button type="button" role="tab" aria-selected="true" style="background: none; border: 0; border-bottom: 2px solid #ef6b6b; color: #ef6b6b; padding: 6px 0; font: inherit; font-weight: 600; font-size: 13px">Action</button>
      <button type="button" role="tab" aria-selected="false" style="background: none; border: 0; border-bottom: 2px solid #34383e; color: #a29d93; padding: 6px 0; font: inherit; font-size: 13px">Bonus</button>
      <button type="button" role="tab" aria-selected="false" style="background: none; border: 0; border-bottom: 2px solid #34383e; color: #a29d93; padding: 6px 0; font: inherit; font-size: 13px">Reaction</button>
    </div>
    <div style="background: #1f2226; border-radius: 12px; padding: 4px 12px">
      <div style="border-bottom: 1px solid #34383e; padding: 9px 0; display: flex; justify-content: space-between"><span><b>Starry Wisp</b><br><span style="color: #a29d93; font-size: 12px">60 ft · 2d8 radiant</span></span><b>+7</b></div>
      <div style="border-bottom: 1px solid #34383e; padding: 9px 0; display: flex; justify-content: space-between"><span><b>Unarmed Strike</b><br><span style="color: #a29d93; font-size: 12px">5 ft · 1d6+3</span></span><b>+6</b></div>
      <div style="border-bottom: 1px solid #34383e; padding: 9px 0; display: flex; justify-content: space-between"><span><b>Moonbeam</b><br><span style="color: #a29d93; font-size: 12px">120 ft · 2d10 radiant</span></span><b>Con 15</b></div>
      <div style="padding: 9px 0"><b>Potion of Healing</b> <span style="color: #a29d93; font-size: 12px">×2</span></div>
    </div>
  </main>
  <nav aria-label="Main" style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #0f1113; border-top: 1px solid #34383e; padding: 6px 4px 18px; text-align: center; font-size: 11px">
    <a href="#" style="color: #a29d93; text-decoration: none; padding: 8px 0">Recap</a>
    <a href="#" style="color: #a29d93; text-decoration: none; padding: 8px 0">Campaign</a>
    <a href="#" style="color: #ffffff; text-decoration: none; padding: 8px 0; font-weight: 700">Play</a>
    <a href="#" style="color: #a29d93; text-decoration: none; padding: 8px 0">Party</a>
    <a href="#" style="color: #a29d93; text-decoration: none; padding: 8px 0">More</a>
  </nav>
</div>
</x-dc>

return {};
}
}
</script>
</body>
</html>
