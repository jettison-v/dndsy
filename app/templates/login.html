{% extends "base.html" %}
{% block title %}Sign in · askdnd{% endblock %}
{% block body %}
<main class="login">
  <section class="section">
    <img src="/static/icons/android-chrome-192x192.png" alt="">
    <h1>askdnd</h1>
    <p class="muted tagline">A companion for our table.</p>
    {% if error %}<div class="flash bad">{{ error }}</div>{% endif %}
    <a class="btn primary block" href="/auth/google{% if back and back != '/' %}?next={{ back | urlencode }}{% endif %}">Sign in with Google</a>
  </section>
</main>
{% endblock %}
