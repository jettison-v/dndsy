{# The large edit window for a campaign entry (the DM, reviewers and admins), opened from its side panel's Edit.
   Everything in it saves in place (HTMX swaps #entity); ✕ closes it. #}
<div class="peek-head">
  <div><div class="note">Edit · {{ kind_label }}</div><h2 id="peek-title">{{ e.name }}</h2></div>
  <button class="btn link peek-close" type="button" aria-label="Close">✕</button>
</div>
<div class="peek-body entity-edit">
  {% include "_entity_body.html" %}
</div>
