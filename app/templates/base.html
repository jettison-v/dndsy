<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>askdnd</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; color: #222; background: #fafaf7; }
    h1 { margin-bottom: 0.25rem; }
    .muted { color: #777; font-size: 0.9rem; }
    .error { color: #a12; }
    .button { display: inline-block; padding: 0.6rem 1.1rem; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #222; text-decoration: none; font: inherit; cursor: pointer; }
    .bad { background: #fdeeee; border: 1px solid #d99; border-radius: 6px; padding: 0.25rem 1rem; }
    .ok { background: #eef8ee; border: 1px solid #9c9; border-radius: 6px; padding: 0.25rem 1rem; }
    code { background: #eee; padding: 0 0.25rem; border-radius: 3px; }
    table.list { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    table.list th, table.list td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid #ddd; vertical-align: top; }
    button.link { background: none; border: none; color: #a12; cursor: pointer; padding: 0; font: inherit; }
    .snapshot div { margin: 0.1rem 0; }
    .snapshot .h1 { font-size: 1.4rem; font-weight: 700; margin-top: 2rem; }
    .snapshot .h2 { font-size: 1.2rem; font-weight: 700; margin-top: 1.5rem; }
    .snapshot .h3, .snapshot .h4 { font-weight: 700; margin-top: 1rem; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
