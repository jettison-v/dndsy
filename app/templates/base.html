<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>askdnd</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; color: #222; background: #fafaf7; }
    h1 { margin-bottom: 0.25rem; }
    .muted { color: #777; font-size: 0.9rem; }
    .error { color: #a12; }
    .button { display: inline-block; padding: 0.6rem 1.1rem; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #222; text-decoration: none; font: inherit; cursor: pointer; }
    .bad { background: #fdeeee; border: 1px solid #d99; border-radius: 6px; padding: 0.25rem 1rem; }
    .ok { background: #eef8ee; border: 1px solid #9c9; border-radius: 6px; padding: 0.25rem 1rem; }
    code { background: #eee; padding: 0 0.25rem; border-radius: 3px; }
    table.list { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    table.list th, table.list td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid #ddd; vertical-align: top; }
    button.link { background: none; border: none; color: #a12; cursor: pointer; padding: 0; font: inherit; }
    .doc { line-height: 1.5; }
    .doc h1 { font-size: 1.5rem; margin-top: 2.5rem; border-bottom: 1px solid #ddd; }
    .doc h2 { font-size: 1.25rem; margin-top: 2rem; }
    .doc h3, .doc h4, .doc h5, .doc h6 { font-size: 1.05rem; margin-top: 1.25rem; }
    .doc ul { padding-left: 1.4rem; margin: 0.3rem 0; }
    .doc li { margin: 0.15rem 0; }
    .doc table { border-collapse: collapse; width: 100%; margin: 0.75rem 0; font-size: 0.92rem; }
    .doc td, .doc th { border: 1px solid #ccc; padding: 0.35rem 0.5rem; vertical-align: top; text-align: left; }
    .doc th { background: #f3f1ea; }
    body.wide { max-width: 52rem; }
    .doc img { max-width: 100%; display: block; margin: 0.5rem 0; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 0.6rem 1rem; margin: 0.75rem 0; }
    .warn { background: #fff6d6; border-color: #e3c766; }
    .pill { font-size: 0.8rem; padding: 0.1rem 0.5rem; border-radius: 999px; background: #eee; white-space: nowrap; }
    .pill.published { background: #d8f0dc; } .pill.draft-ready, .pill.review { background: #fff1c2; } .pill.drafting { background: #dde8fb; }
    .primary { background: #2c5e3f; border-color: #2c5e3f; color: #fff; }
    button.link-button { background: none; border: none; color: #2c5e3f; text-decoration: underline; cursor: pointer; padding: 0; font: inherit; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
</body>
</html>
