{# The menu bar's Live control (app/live.py): when the D&D Beyond copy was last updated. Green
   while Game Mode is on in this browser (body.gm-on, app.js). Opens the Live popover. #}
{% set p = tn.pill %}
{% if p %}{% set fid = tn.focus.id if tn.focus else "" %}
<button type="button" id="live-pill" class="live-pill{{ ' warn' if p.failed }}" data-menu="live-menu" aria-haspopup="dialog" aria-controls="live-menu"
  hx-get="/live{{ '?c=%s' % fid if fid }}" hx-target="#live-menu" hx-trigger="click" data-focus="{{ fid }}" data-every="{{ tn.every }}"{% if oob %} hx-swap-oob="true"{% endif %}
  title="{% if p.failed %}Couldn't refresh {{ p.name }} from D&amp;D Beyond; showing the copy from {{ p.fetched_at | ago }}{% elif tn.party_pill %}The party's oldest copy from D&amp;D Beyond ({{ p.name }}){% else %}{{ p.name }}, from D&amp;D Beyond{% endif %}">
  <span class="live-dot" aria-hidden="true"></span><span class="live-word">Live</span><span class="live-ago"><span class="live-off">Updated</span><span class="live-on"> · updated</span> {{ (p.fetched_at | ago) or "never" }}</span></button>
{% endif %}
