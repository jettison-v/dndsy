{% extends "base.html" %}
{% block title %}{{ c.entity.name }} · Battle · askdnd{% endblock %}
{% block head %}<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" defer></script>{% endblock %}
{% block content %}
<main class="page wide">
  <div class="char-nav">
    <span class="note">Battle:</span>
    {% for o in others %}<a href="/characters/{{ o.id }}/battle" class="{{ 'on' if o.id == c.id }}">{{ o.entity.name }}</a>{% endfor %}
    <a class="btn small" href="/characters/{{ c.id }}" style="margin-left:auto">Full character →</a>
  </div>
  {% include "_battle_body.html" %}
</main>
{% endblock %}
