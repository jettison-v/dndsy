{# Top of every Manage page: back to the overview, and tabs for the pages this person can open. #}
<nav class="manage-tabs" aria-label="Manage">
  <a href="/manage" class="manage-home">Manage</a>
  {% for p in manage_pages %}<a href="{{ p.href }}" class="{{ 'on' if p.here }}"{% if p.here %} aria-current="page"{% endif %}>{{ p.label }}</a>{% endfor %}
</nav>
