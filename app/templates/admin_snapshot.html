{% extends "base.html" %}
{% block body_class %}wide{% endblock %}
{% block content %}
<header>
  <h1>{{ snap.source.title or "Notes" }}</h1>
  <a class="button" href="/admin/notes">Back</a>
</header>
<p class="muted">Synced copy from {{ snap.created_at.strftime("%b %-d, %Y %-I:%M %p") }} UTC.</p>
<div class="doc">{{ body | safe }}</div>
{% endblock %}
